services:
  tuirowser:
    build: .
    container_name: tuirowser-browser
    ports:
      - "8081:8081"
    depends_on:
      - searxng
    environment:
      - SEARXNG_URL=http://searxng:8080

  searxng:
    image: searxng/searxng:latest
    container_name: tuirowser-searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_PORT=8080
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped

volumes:
  searxng-data: