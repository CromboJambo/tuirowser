[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A TUI web browser that simplifies pages to markdown"
license = "MIT"
repository = "https://github.com/CromboJambo/tuirowser"

[workspace.dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# HTML parsing
html5ever = "0.31"
markup5ever_rcdom = "0.39"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
unicode-width = "0.2"
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"