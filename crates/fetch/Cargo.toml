[package]
name = "tuirowser-fetch"
version.workspace = true
edition.workspace = true
description = "HTTP client for fetching web pages with cookie support"
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable Obscura browser backend via JSON-RPC over HTTP.
# Requires an external `obscura mcp --http` server to be running.
obscura = []

[dependencies]
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
urlencoding = "2"
crabjar-web-search = { git = "https://github.com/CromboJambo/crabjar.git", branch = "main" }
crabjar-web-extract = { git = "https://github.com/CromboJambo/crabjar.git", branch = "main" }